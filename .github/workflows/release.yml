name: Release

# Tag 驱动的发布：push 一个 `v*` tag，就在原生 runner 上构建各平台二进制，
# 生成 checksums.txt，创建 GitHub Release 并上传全部产物。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 【重跑】不要用 Run 页面上的 "Re-run all jobs" —— 它沿用该 run 当时的提交里的
# 工作流，也就是 tag 指向的那个旧版本；工作流本身写错时重跑等于白跑。
# 正确做法是 Actions → Release → Run workflow，分支选 main，tag 填 v0.1.0。
#
# ============================================================================
# 【命名契约 —— 改这里必须同步改另一处】
#   packages/rsi3d-cli/bin/launcher.js 的 target()/exeName() —— npm 包装按这个拼 URL
# 产物名：<binary>-<plat>-<arch>[.exe]
#   binary ∈ {rsi3d, rsi3d-harness}
#   plat   ∈ {darwin, linux, win32}
#   arch   ∈ {x64, arm64}
#
# ⚠️ 这里 plat 用的是 **win32**（Node 的 process.platform 原值），arch 用 **x64**；
#    兄弟工程 ncc 的约定恰好相反（那边映射成 windows / x86_64）。两边**不要**
#    互相"统一" —— 各自的包装脚本按各自的值拼 URL，改一边就要同步改那边。
#    （download.js 若与 launcher.js 的 target() 分歧，后果是安装时 404，而本地
#      构建一切正常 —— 只有真发到 Release 之后才暴露。）
# ============================================================================
#
# 本仓库产出**两个**二进制，都要发：`rsi3d`（平台 CLI）与 `rsi3d-harness`
# （开源引擎的本地能力）。npm 包的两个命令各对应一个。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0（注意：上方 'Use workflow from' 必须保持 main，不能选这个 tag）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先把「发布哪个 tag / 哪个版本」定下来，并做一致性校验。
  # 产物名里嵌了 version，如果 tag 和 Cargo.toml 对不上，用户按 tag 拼出来的
  # URL 会和实际资产名错位 —— 宁可在构建前就失败。
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # "Use workflow from" 下拉框必须是 main。若选了 tag，GitHub 加载的是
            # 那个 tag 里当时的工作流文件 —— main 上的修复一律不生效。
            if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
              echo "::error::'Use workflow from' 必须选 main，当前是 ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME} —— 选 tag 会用该 tag 里的旧工作流" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          case "$tag" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头，收到 '${tag}'" >&2; exit 1 ;;
          esac

          # 这是 workspace，版本号在根的 [workspace.package] 下 —— 与 ncc
          # （独立 crate、版本在 cli/Cargo.toml）不同。首个 ^version = " 就是它。
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::无法从根 Cargo.toml 读出 workspace version" >&2
            exit 1
          fi

          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} 与 Cargo.toml 的 version ${version} 不一致" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "将发布 ${tag}（version ${version}）"

  build:
    needs: prepare
    # 一个平台挂了不要连坐，其余平台仍然产出，方便只重跑失败的那个。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            plat: darwin
            arch: arm64
          # 故意不用 macos-13（Intel）：该 runner 已被 GitHub 弃用，实测排 10 分钟
          # 也拿不到机器，会一直卡在 queued。改成在 arm64 的 macos-14 上交叉编译。
          - runner: macos-14
            plat: darwin
            arch: x64
            target: x86_64-apple-darwin
          # 用 22.04 而不是 ubuntu-latest：glibc 基线更低，老发行版上跑得起来。
          - runner: ubuntu-22.04
            plat: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            plat: linux
            arch: arm64
          # ⚠️ 是 win32 不是 windows —— 见文件头「命名契约」，由 launcher.js 决定。
          - runner: windows-latest
            plat: win32
            arch: x64
          - runner: windows-11-arm
            plat: win32
            arch: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 准备交叉编译目标
        if: matrix.target != ''
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # --workspace：两个二进制分属不同 crate（cli/ 出 rsi3d，crates/native/ 出
      # rsi3d-harness），一次构建全部产出。--locked 让锁文件与 Cargo.toml 不一致
      # 时直接失败，而不是让 CI 偷偷改锁。
      - name: 构建
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            cargo build --release --locked --workspace --target "$TARGET"
          else
            cargo build --release --locked --workspace
          fi

      - name: 按约定命名
        shell: bash
        env:
          PLAT: ${{ matrix.plat }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          ext=""
          if [ "$PLAT" = "win32" ]; then ext=".exe"; fi

          if [ -n "$TARGET" ]; then
            outdir="target/${TARGET}/release"
          else
            outdir="target/release"
          fi

          mkdir -p dist
          for bin in rsi3d rsi3d-harness; do
            src="${outdir}/${bin}${ext}"
            if [ ! -f "$src" ]; then
              echo "::error::找不到构建产物 $src" >&2
              exit 1
            fi
            cp "$src" "dist/${bin}-${PLAT}-${ARCH}${ext}"
            cp "$src" "dist/${bin}-latest-${PLAT}-${ARCH}${ext}"
          done
          chmod +x dist/* 2>/dev/null || true

          # 拦「构建悄悄产出空文件」这一类：真实二进制是 MB 量级，而 npm 包装的
          # 下载侧也有一条同样的下限检查（<1024 字节即拒绝安装）。
          for f in dist/*; do
            size=$(wc -c < "$f" | tr -d ' ')
            echo "  $(basename "$f")  ${size} 字节"
            if [ "$size" -lt 102400 ]; then
              echo "::error::$f 只有 ${size} 字节，不像一个真实的二进制" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rsi3d-${{ matrix.plat }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 checksums.txt
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          # 用裸文件名（不要 ./*），否则 checksums.txt 里的路径会带 ./ 前缀，
          # 而 packages/rsi3d-cli/bin/download.js 是按 basename 去查的。
          # 格式 `<sha256>  <文件名>` 与它的 parseChecksums() 正则一致。
          sha256sum * > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

          # 平台/二进制数量是最容易静默出错的维度：矩阵里某个 runner label 失效时，
          # fail-fast: false 会让作业整体成功、只是少一个平台。少一个平台的表现
          # 是该平台用户装不上，而发布页看起来完全正常。
          # 期望 2 个二进制 × 6 平台 × 2 份（带版本 + latest 别名）= 24 个文件。
          n=$(ls -1 | grep -c '^rsi3d' || true)
          echo "产物文件数：$n（期望 24）"
          if [ "$n" -ne 24 ]; then
            echo "::error::产物数量不对（$n ≠ 24），可能是某个平台的 runner 没拿到机器 —— 检查 build 矩阵的每个作业是否都成功" >&2
            exit 1
          fi

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "rsi3d ${TAG}" \
              --generate-notes
          fi

          echo "=== 已发布资产 ==="
          gh release view "$TAG" --json assets --jq '.assets[].name'
